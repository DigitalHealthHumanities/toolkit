  bio: Sean Purcell is a digital humanist, medical historian, and thanatologist. He completed his PhD at Indiana University's Media School, and his dissertation, <a href="https://tuberculosisspecimen.github.io/diss/index"><i>The Tuberculosis Specimen</i></a>, covered the ethical problems of doing research in the history of medicine. His work has been published in <i>In the Library with the Lead Pipe</i> and <i>Game Studies</i>
